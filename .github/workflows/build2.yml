name: Build Android APK (build2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    name: Velora APK (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + platform
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build release APK
        run: cargo apk build --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-APK
          path: target/release/apk/*.apk
          if-no-files-found: error
