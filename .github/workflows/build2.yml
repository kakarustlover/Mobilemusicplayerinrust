name: Build Android APK (build2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    name: Velora APK (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + platform
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build release APK
        run: cargo apk build --release

      - name: Collect APK
        run: |
          find target/release/apk -name "*.apk" -exec cp {} Velora.apk \;
          ls -la Velora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velora-APK
          path: Velora.apk
          if-no-files-found: error
