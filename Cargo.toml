[package]
name = "velora"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["mobile"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
jni = "0.21"
ndk-context = "0.1"

[features]
default = ["mobile"]
mobile = ["dioxus/mobile"]
android = ["dioxus/mobile"]

# The debug build is what gets installed, so make it fast.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
incremental = false

[profile.release]
opt-level = 3
