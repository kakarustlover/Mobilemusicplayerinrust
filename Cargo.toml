[package]
name = "velora"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.android]
package = "com.velora.player"
apk_name = "Velora"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Velora"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.signing.release]
path = "velora.keystore"
keystore_password = "velora123"
