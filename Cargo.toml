[package]
name = "velora"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jni = "0.21"
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = 3

[package.metadata.android]
package = "com.velora.player"
apk_name = "Velora"
build_targets = ["aarch64-linux-android"]


[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Velora"


[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[package.metadata.android.signing.release]
path = "$HOME/.android/debug.keystore"
keystore_password = "android"
